<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lead capture and follow-up automation</title>
  <desc id="desc">A clean workflow interface showing a new enquiry moving through qualification, CRM assignment and a personalized follow-up.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3F1EA"/><stop offset="1" stop-color="#E5ECE6"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2E7775"/><stop offset="1" stop-color="#174D4C"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1220" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#canvas)"/>
  <circle cx="1080" cy="80" r="190" fill="#B89455" opacity=".10"/>
  <circle cx="100" cy="680" r="190" fill="#2E7775" opacity=".08"/>
  <text x="72" y="78" fill="#52615E" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">LEAD-TO-CONVERSATION WORKFLOW</text>
  <text x="72" y="125" fill="#0B1220" font-family="Arial,sans-serif" font-size="34" font-weight="700">Every enquiry gets a next step.</text>
  <g filter="url(#shadow)">
    <rect x="66" y="190" width="280" height="390" rx="22" fill="#FFFFFF"/>
    <rect x="66" y="190" width="280" height="56" rx="22" fill="#E9EEEA"/>
    <circle cx="94" cy="218" r="6" fill="#D28F82"/><circle cx="116" cy="218" r="6" fill="#C6A15D"/><circle cx="138" cy="218" r="6" fill="#6C9A84"/>
    <text x="94" y="292" fill="#0B1220" font-family="Arial,sans-serif" font-size="22" font-weight="700">New website lead</text>
    <text x="94" y="324" fill="#68736F" font-family="Arial,sans-serif" font-size="15">Contact form received</text>
    <rect x="94" y="356" width="224" height="46" rx="9" fill="#F5F7F4" stroke="#D8E0D9"/>
    <text x="112" y="385" fill="#8A9690" font-family="Arial,sans-serif" font-size="14">Name and email</text>
    <rect x="94" y="416" width="224" height="46" rx="9" fill="#F5F7F4" stroke="#D8E0D9"/>
    <text x="112" y="445" fill="#8A9690" font-family="Arial,sans-serif" font-size="14">Project requirements</text>
    <rect x="94" y="488" width="224" height="48" rx="10" fill="url(#teal)"/>
    <text x="206" y="518" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAPTURED</text>
  </g>
  <path d="M370 385H430" stroke="#2E7775" stroke-width="4" stroke-linecap="round"/><path d="m416 371 14 14-14 14" fill="none" stroke="#2E7775" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="452" y="240" width="290" height="290" rx="24" fill="#0B1220"/>
    <circle cx="597" cy="328" r="43" fill="#2E7775"/>
    <path d="M579 328h36M597 310v36" stroke="#F3F1EA" stroke-width="4" stroke-linecap="round"/>
    <text x="597" y="408" text-anchor="middle" fill="#F3F1EA" font-family="Arial,sans-serif" font-size="23" font-weight="700">Qualify &amp; route</text>
    <text x="597" y="443" text-anchor="middle" fill="#B7C9C4" font-family="Arial,sans-serif" font-size="15">Validate · Score · Assign</text>
    <rect x="512" y="472" width="170" height="8" rx="4" fill="#304344"/>
    <rect x="512" y="472" width="128" height="8" rx="4" fill="#B89455"/>
  </g>
  <path d="M766 385H826" stroke="#2E7775" stroke-width="4" stroke-linecap="round"/><path d="m812 371 14 14-14 14" fill="none" stroke="#2E7775" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="848" y="190" width="286" height="390" rx="22" fill="#FFFFFF"/>
    <rect x="874" y="220" width="234" height="64" rx="13" fill="#EAF1EC"/>
    <circle cx="908" cy="252" r="17" fill="#2E7775"/>
    <path d="m900 252 6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="938" y="258" fill="#0B1220" font-family="Arial,sans-serif" font-size="17" font-weight="700">CRM updated</text>
    <text x="876" y="330" fill="#0B1220" font-family="Arial,sans-serif" font-size="20" font-weight="700">Follow-up queued</text>
    <rect x="874" y="352" width="234" height="132" rx="14" fill="#F5F7F4" stroke="#D8E0D9"/>
    <rect x="894" y="374" width="126" height="9" rx="4" fill="#B9C6BE"/>
    <rect x="894" y="395" width="190" height="8" rx="4" fill="#D6DED8"/>
    <rect x="894" y="414" width="170" height="8" rx="4" fill="#D6DED8"/>
    <rect x="894" y="444" width="104" height="24" rx="12" fill="#DCEAE3"/>
    <text x="946" y="460" text-anchor="middle" fill="#2E7775" font-family="Arial,sans-serif" font-size="11" font-weight="700">READY TO SEND</text>
    <text x="876" y="530" fill="#2E7775" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PERSONALIZED RESPONSE</text>
  </g>
  <text x="600" y="654" text-anchor="middle" fill="#66736D" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">CAPTURE  →  QUALIFY  →  ASSIGN  →  FOLLOW UP</text>
</svg>